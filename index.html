<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B&K Expenses Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }

  /* Theme 1: Terracotta & Sage (default) */
  :root, html[data-theme="terracotta"] {
    --bg: #FAF3E7; --card: #FFFDF8; --card-border: #E8DCC5;
    --input-bg: #F3E9D7; --input-border: #D9C8A8;
    --text-strong: #4A3B2A; --text-body: #5C4B3A; --text-secondary: #9C8768;
    --text-faint: #B5A488; --text-footer: #AE9C7E; --divider: #EDE1CB;
    --accent: #C17F56; --accent-rgb: 193,127,86;
    --accent-2: #8B9A7A;
    --positive: #8FA878; --positive-rgb: 143,168,120; --positive-border: #6B8F5A;
    --negative: #C97A62; --negative-rgb: 201,122,98; --negative-border: #A85C46;
    --gradient-start: #F5E6CE;
    --btn-text: #FAF3E7;
  }

  /* Theme 2: Sage & Linen */
  html[data-theme="sage"] {
    --bg: #F4F1E8; --card: #FFFFFB; --card-border: #DCE0CB;
    --input-bg: #EDEEE0; --input-border: #CBD2B8;
    --text-strong: #3A4A35; --text-body: #46543F; --text-secondary: #7C8A6C;
    --text-faint: #A8B39A; --text-footer: #98A488; --divider: #E3E7D6;
    --accent: #7A9471; --accent-rgb: 122,148,113;
    --accent-2: #B98F5E;
    --positive: #96AD80; --positive-rgb: 150,173,128; --positive-border: #6B8F5A;
    --negative: #C08560; --negative-rgb: 192,133,96; --negative-border: #A0653F;
    --gradient-start: #E7EAD8;
    --btn-text: #FFFFFB;
  }

  /* Theme 3: Blush & Sand */
  html[data-theme="blush"] {
    --bg: #FBF3EE; --card: #FFFFFC; --card-border: #EDDCD2;
    --input-bg: #F6E9E1; --input-border: #E0C7B8;
    --text-strong: #5A3E37; --text-body: #6B4C43; --text-secondary: #A6857C;
    --text-faint: #C7AFA6; --text-footer: #B99C90; --divider: #F1E1D8;
    --accent: #D98E82; --accent-rgb: 217,142,130;
    --accent-2: #C9A46B;
    --positive: #96AD8A; --positive-rgb: 150,173,138; --positive-border: #71906A;
    --negative: #C97064; --negative-rgb: 201,112,100; --negative-border: #A34E42;
    --gradient-start: #F6DED2;
    --btn-text: #FFFFFC;
  }

  /* Theme 4: Midnight (the original dark navy & gold) */
  html[data-theme="midnight"] {
    --bg: #101B2D; --card: #16233A; --card-border: #24334E;
    --input-bg: #0F1B2D; --input-border: #2C3E5E;
    --text-strong: #F5F1E6; --text-body: #E9E4D8; --text-secondary: #8A97AD;
    --text-faint: #6B7A93; --text-footer: #4A5872; --divider: #1F2C44;
    --accent: #C9A24B; --accent-rgb: 201,162,75;
    --accent-2: #5C7599;
    --positive: #8FBF9F; --positive-rgb: 143,191,159; --positive-border: #3E6E52;
    --negative: #D98686; --negative-rgb: 217,134,134; --negative-border: #6E3E3E;
    --gradient-start: #1B2942;
    --btn-text: #101B2D;
  }

  html { transition: none; }
  body { transition: background 0.2s ease, color 0.2s ease; }
  .theme-swatch {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
  }
  .theme-swatch.active { border-color: var(--text-strong); }
  .filter-card { transition: all 0.15s ease; }
  .filter-card:hover { box-shadow: 0 0 0 1px var(--accent) inset; }
  .filter-active { box-shadow: 0 0 0 2px var(--accent) inset; background: rgba(var(--accent-rgb),0.08); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    padding: 32px 16px 64px;
  }
  .ledger-font { font-family: 'Fraunces', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  input, select, button { font-family: inherit; }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  ::placeholder { color: var(--text-faint); }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 34px; font-weight: 600; margin: 0; color: var(--accent); letter-spacing: -0.01em; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .sub { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 9px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .tab-btn.active { border-color: var(--accent); background: rgba(var(--accent-rgb),0.14); color: var(--text-strong); }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; }
  .label { font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 5px; }
  .label .hint { color: var(--text-footer); }
  .input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px;
    padding: 10px 12px; color: var(--text-strong); font-size: 14px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .chip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  #categoryGrid { grid-template-columns: repeat(3, 1fr); }
  .chip {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 4px; border-radius: 8px; border: 1px solid var(--input-border);
    background: var(--input-bg); color: var(--text-secondary); cursor: pointer; font-size: 10.5px; text-align: center; line-height: 1.25;
  }
  .chip.active { border-color: var(--accent); background: rgba(var(--accent-rgb),0.14); color: var(--text-strong); }
  .chip svg { width: 15px; height: 15px; }
  .btn-primary {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: var(--btn-text); border: none; border-radius: 8px; padding: 11px 16px;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .err { font-size: 12px; color: var(--negative); margin-top: 8px; }
  .ok { font-size: 12px; color: var(--positive); margin-top: 8px; }
  .foot-note { text-align: center; font-size: 11px; color: var(--text-footer); margin-top: 20px; line-height: 1.6; }
  .totals-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .tot-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 10px; }
  .tot-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .tot-head span { font-size: 10px; letter-spacing: 0.06em; color: var(--text-secondary); text-transform: uppercase; }
  .tot-val { font-size: 16px; font-weight: 600; color: var(--text-strong); }
  .grand {
    background: linear-gradient(135deg, var(--gradient-start) 0%, var(--card) 100%); border: 1px solid var(--input-border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-head { font-size: 11px; letter-spacing: 0.1em; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; }
  .entry-list { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; }
  .entry-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--divider); }
  .entry-row:first-child { border-top: none; }
  .entry-row:hover { background: rgba(var(--accent-rgb),0.08); }
  .entry-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--input-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .entry-icon svg { width: 14px; height: 14px; }
  .entry-main { flex: 1; min-width: 0; }
  .entry-title { font-size: 14px; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .entry-amt { font-size: 15px; font-weight: 600; color: var(--text-strong); }
  .del-btn { background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 4px; display: flex; opacity: 0; transition: opacity .15s; }
  .entry-row:hover .del-btn { opacity: 1; }
  .empty { padding: 28px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .link-btn { background: none; border: none; color: var(--text-faint); font-size: 12px; cursor: pointer; }
  select.pill {
    font-size: 15px; color: var(--text-strong); background: var(--card); border: 1px solid var(--card-border);
    border-radius: 8px; padding: 8px 10px; cursor: pointer;
  }
  .cat-bar-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--divider); }
  .cat-bar-row:first-child { border-top: none; }
  .bar-track { height: 4px; background: var(--input-bg); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar-fill { height: 100%; background: var(--accent); }
  .settings-panel {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; margin-bottom: 20px;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary);
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 999px; padding: 5px 12px;
    transition: all 0.2s ease;
  }
  .status-pill.on { color: var(--positive); background: rgba(var(--positive-rgb),0.13); border-color: var(--positive-border); }
  .status-pill.off { color: var(--negative); background: rgba(var(--negative-rgb),0.14); border-color: var(--negative-border); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .status-dot.on { background: var(--positive); }
  .status-dot.off { background: var(--negative); }
  svg.icon { stroke: currentColor; fill: none; stroke-width: 2; }
  .compare-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .compare-chart { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; }
  .legend { display: flex; gap: 16px; justify-content: flex-end; margin-bottom: 10px; }
  .legend-dot { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
  .legend-dot span { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .chart-label { width: 110px; font-size: 12px; color: var(--text-body); flex-shrink: 0; }
  .chart-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .chart-bar-track { background: var(--input-bg); border-radius: 3px; height: 12px; overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 3px; }
  .chart-val { font-size: 10px; color: var(--text-faint); margin-left: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom: 14px;">
    <h1>B&amp;K Expenses Tracker</h1>
  </div>

  <div style="display:flex; align-items:center; gap:8px; margin-bottom: 22px;" id="themeSwitcher">
    <span style="font-size:11px; color:var(--text-faint);">Theme:</span>
    <button type="button" class="theme-swatch" data-theme="terracotta" title="Terracotta &amp; Sage" style="background: linear-gradient(135deg, #C17F56 50%, #8FA878 50%);"></button>
    <button type="button" class="theme-swatch" data-theme="sage" title="Sage &amp; Linen" style="background: linear-gradient(135deg, #7A9471 50%, #B98F5E 50%);"></button>
    <button type="button" class="theme-swatch" data-theme="blush" title="Blush &amp; Sand" style="background: linear-gradient(135deg, #D98E82 50%, #C9A46B 50%);"></button>
    <button type="button" class="theme-swatch" data-theme="midnight" title="Midnight" style="background: linear-gradient(135deg, #101B2D 50%, #C9A24B 50%);"></button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div style="display:flex; align-items:center; justify-content:space-between;" id="settingsHeaderRow">
      <div class="section-head" style="margin-bottom:0;">Google Sheets connection</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="status-pill" id="statusPill"><span class="status-dot" id="statusDot"></span><span id="statusText">Not connected</span></span>
        <button class="link-btn" id="settingsToggleBtn" style="display:none;">Edit</button>
      </div>
    </div>
    <div id="settingsFields" style="margin-top:12px;">
      <div class="row2">
        <div>
          <label class="label">OAuth Client ID</label>
          <input class="input" id="clientIdInput" placeholder="xxxx.apps.googleusercontent.com" />
        </div>
        <div>
          <label class="label">Spreadsheet ID</label>
          <input class="input" id="sheetIdInput" placeholder="from the sheet's URL" />
        </div>
      </div>
      <label class="label">Tab name <span class="hint">(the sheet tab at the bottom, default "Sheet1")</span></label>
      <div style="margin-bottom:10px;">
        <input class="input" id="tabNameInput" placeholder="Sheet1" />
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" id="saveSettingsBtn" style="width:auto; padding:9px 16px;">Save</button>
        <button class="btn-primary" id="connectBtn" style="width:auto; padding:9px 16px; background:var(--accent-2); color:var(--text-strong);">Connect Google Account</button>
      </div>
      <div class="foot-note" style="margin-top:10px; text-align:left;">
        One-time setup only — saved in this browser. See the setup guide for how to get these two values.
      </div>
    </div>
  </div>

  <div class="settings-panel" id="importPanel" style="display:none;">
    <div class="section-head" style="margin-bottom:12px;">Import from another sheet</div>
    <div class="row2">
      <div>
        <label class="label">Source Spreadsheet ID</label>
        <input class="input" id="importSheetIdInput" placeholder="from the other sheet's URL" />
      </div>
      <div>
        <label class="label">Source Sheet / Range <span class="hint">(e.g. "Form Responses 1")</span></label>
        <input class="input" id="importRangeInput" placeholder="Form Responses 1" />
      </div>
    </div>
    <button class="btn-primary" id="loadImportBtn" style="width:auto; padding:9px 16px; margin-bottom:12px;">Load columns</button>
    <div id="importMappingArea"></div>
  </div>

  <div style="margin-bottom: 20px;">
    <button class="link-btn" id="toggleImportBtn">+ Import from another Google Sheet</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-page="add">Add Expense</button>
    <button class="tab-btn" data-page="summary">Summary (MTD)</button>
    <button class="tab-btn" data-page="compare">Compare</button>
  </div>

  <div id="page-add"></div>
  <div id="page-summary" style="display:none;"></div>
  <div id="page-compare" style="display:none;"></div>
</div>

<script>
/* ---------- Config / constants ---------- */
const METHODS = [
  { id: "cash", label: "Cash", icon: "wallet" },
  { id: "joint", label: "Joint Bank", icon: "users" },
  { id: "personal", label: "Personal Bank", icon: "landmark" },
  { id: "credit", label: "Credit Card", icon: "card" },
];
const CATEGORIES = [
  { id: "Groceries", icon: "cart" },
  { id: "Dine Out / Takeaway", icon: "utensils" },
  { id: "Home Expenses", icon: "home" },
  { id: "Personal Expenses", icon: "user" },
  { id: "Insurance", icon: "shield" },
  { id: "Subscriptions and Bills", icon: "receipt" },
  { id: "Transportation", icon: "car" },
  { id: "Repayments", icon: "refresh" },
  { id: "Others", icon: "more" },
];
const SHEET_RANGE_SUFFIX = "A:F"; // Date, Category, Remarks, Method, Amount, RowId(timestamp)
function tabName() { return localStorage.getItem("el_tab_name") || "Sheet1"; }
function sheetRange(suffix) { return tabName() + "!" + suffix; }
const SCOPES = "https://www.googleapis.com/auth/spreadsheets";

const ICONS = {
  wallet: '<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  landmark: '<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
  card: '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  cart: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  coffee: '<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/>',
  utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
  receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/>',
  car: '<path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  swap: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  close: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
};
function icon(name, size) {
  size = size || 15;
  return '<svg class="icon" viewBox="0 0 24 24" width="'+size+'" height="'+size+'">' + (ICONS[name]||"") + "</svg>";
}
function methodInfo(id) { return METHODS.find(m => m.id === id) || METHODS[0]; }
function categoryInfo(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1]; }
function fmt(n) { n = Number(n) || 0; return n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function monthKey(d) { return (d||"").slice(0,7); }
function monthLabelOf(mKey) {
  const parts = mKey.split("-").map(Number);
  return new Date(parts[0], parts[1]-1, 1).toLocaleDateString(undefined, {month:"long", year:"numeric"});
}

/* ---------- State ---------- */
let state = {
  page: "add",
  entries: [],       // {rowIndex, date, category, note, method, amount}
  loading: true,
  category: "",
  method: "cash",
  selectedMonth: monthKey(todayStr()),

  compareB: monthKey(todayStr()),
  accessToken: null,
  sheetGid: null,
  summaryFilter: null, // { type: "method"|"category", value: string } | null
};

/* ---------- Google auth + Sheets API ---------- */
let tokenClient = null;

function getSettings() {
  return {
    clientId: localStorage.getItem("el_client_id") || "",
    sheetId: localStorage.getItem("el_sheet_id") || "",
  };
}

function setStatus(text, kind) {
  document.getElementById("statusText").textContent = text;
  const dot = document.getElementById("statusDot");
  dot.className = "status-dot" + (kind ? " " + kind : "");
  const pill = document.getElementById("statusPill");
  pill.className = "status-pill" + (kind ? " " + kind : "");
  setSettingsCollapsed(kind === "on");
}

function setSettingsCollapsed(collapsed) {
  document.getElementById("settingsFields").style.display = collapsed ? "none" : "block";
  document.getElementById("settingsToggleBtn").style.display = collapsed ? "inline-block" : "none";
}

document.getElementById("settingsToggleBtn").addEventListener("click", () => setSettingsCollapsed(false));

function initAuth() {
  const { clientId } = getSettings();
  if (!clientId || !window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: SCOPES,
    callback: () => {}, // overridden per-request by requestToken()
  });
  attemptSilentConnect();
}

function requestToken(promptMode) {
  return new Promise((resolve, reject) => {
    if (!tokenClient) { reject(new Error("Google sign-in not ready yet")); return; }
    tokenClient.callback = (resp) => {
      if (resp.error) { reject(resp); return; }
      state.accessToken = resp.access_token;
      resolve(resp.access_token);
    };
    tokenClient.requestAccessToken(promptMode === undefined ? {} : { prompt: promptMode });
  });
}

async function attemptSilentConnect() {
  const { sheetId } = getSettings();
  if (!sheetId) return;
  setStatus("Connecting…");
  try {
    await requestToken(""); // no UI shown; succeeds only if already granted + still signed in
    setStatus("Connected", "on");
    await loadEntries();
  } catch (e) {
    setStatus("Not connected — tap Connect");
  }
}

document.getElementById("saveSettingsBtn").addEventListener("click", () => {
  const clientId = document.getElementById("clientIdInput").value.trim();
  const sheetId = document.getElementById("sheetIdInput").value.trim();
  const tabNameVal = document.getElementById("tabNameInput").value.trim() || "Sheet1";
  localStorage.setItem("el_client_id", clientId);
  localStorage.setItem("el_sheet_id", sheetId);
  localStorage.setItem("el_tab_name", tabNameVal);
  initAuth();
  setStatus(clientId && sheetId ? "Saved — click Connect" : "Not connected");
});

document.getElementById("connectBtn").addEventListener("click", async () => {
  const { clientId, sheetId } = getSettings();
  if (!clientId || !sheetId) { alert("Enter your Client ID and Spreadsheet ID first, then Save."); return; }
  if (!tokenClient) initAuth();
  setStatus("Connecting…");
  try {
    await requestToken(); // interactive — shows Google's sign-in/consent if needed
    setStatus("Connected", "on");
    await loadEntries();
  } catch (e) {
    setStatus("Connection failed", "off");
  }
});

async function authFetch(url, opts) {
  opts = opts || {};
  const doFetch = () => fetch(url, Object.assign({}, opts, {
    headers: Object.assign({ "Authorization": "Bearer " + state.accessToken }, opts.headers || {}),
  }));
  let res = await doFetch();
  if (res.status === 401) {
    // token expired mid-session — try a silent refresh once, then retry the request
    try { await requestToken(""); res = await doFetch(); } catch (e) { /* fall through, will throw below */ }
  }
  if (!res.ok) {
    const body = await res.text();
    throw new Error("API error " + res.status + ": " + body);
  }
  return res.json();
}

async function sheetsFetch(path, opts) {
  opts = opts || {};
  const { sheetId } = getSettings();
  const url = "https://sheets.googleapis.com/v4/spreadsheets/" + sheetId + path;
  return authFetch(url, Object.assign({}, opts, {
    headers: Object.assign({ "Content-Type": "application/json" }, opts.headers || {}),
  }));
}

async function ensureHeaderAndGid() {
  const meta = await sheetsFetch("?fields=sheets.properties");
  const sheetProps = meta.sheets.find(s => s.properties.title === tabName()) || meta.sheets[0];
  state.sheetGid = sheetProps.properties.sheetId;
  const vals = await sheetsFetch("/values/" + encodeURIComponent(sheetRange(SHEET_RANGE_SUFFIX)));
  if (!vals.values || vals.values.length === 0) {
    await sheetsFetch("/values/" + encodeURIComponent(sheetRange("A1")) + ":append?valueInputOption=USER_ENTERED", {
      method: "POST",
      body: JSON.stringify({ values: [["Date","Category","Remarks","Method","Amount","RowId"]] }),
    });
  }
}

async function loadEntries() {
  state.loading = true;
  render();
  try {
    await ensureHeaderAndGid();
    const vals = await sheetsFetch("/values/" + encodeURIComponent(sheetRange(SHEET_RANGE_SUFFIX)));
    const rows = (vals.values || []).slice(1); // skip header
    state.entries = rows.map((r, i) => ({
      sheetRow: i + 2, // 1-indexed, +1 for header
      date: r[0] || "",
      category: r[1] || "",
      note: r[2] || "",
      method: (METHODS.find(m => m.label === r[3]) || {}).id || "cash",
      amount: parseFloat(r[4]) || 0,
      rowId: r[5] || "",
    }));
  } catch (e) {
    console.error(e);
    setStatus("Sync error", "off");
  } finally {
    state.loading = false;
    render();
  }
}

async function appendEntry(entry) {
  const row = [entry.date, entry.category, entry.note, methodInfo(entry.method).label, entry.amount.toFixed(2), entry.rowId];
  await sheetsFetch("/values/" + encodeURIComponent(sheetRange(SHEET_RANGE_SUFFIX)) + ":append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS", {
    method: "POST",
    body: JSON.stringify({ values: [row] }),
  });
}

async function appendRows(rows) {
  // rows: array of [date, category, note, methodLabel, amountStr, rowId]
  const chunkSize = 400;
  for (let i = 0; i < rows.length; i += chunkSize) {
    const chunk = rows.slice(i, i + chunkSize);
    await sheetsFetch("/values/" + encodeURIComponent(sheetRange(SHEET_RANGE_SUFFIX)) + ":append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS", {
      method: "POST",
      body: JSON.stringify({ values: chunk }),
    });
  }
}

async function deleteEntryRow(sheetRow) {
  await sheetsFetch(":batchUpdate", {
    method: "POST",
    body: JSON.stringify({
      requests: [{
        deleteDimension: {
          range: { sheetId: state.sheetGid, dimension: "ROWS", startIndex: sheetRow - 1, endIndex: sheetRow }
        }
      }]
    }),
  });
}

/* ---------- Import from another sheet ---------- */
async function fetchSourceValues(spreadsheetId, range) {
  const url = "https://sheets.googleapis.com/v4/spreadsheets/" + spreadsheetId + "/values/" + encodeURIComponent(range);
  return authFetch(url);
}

function guessMethodMatch(raw) {
  const s = (raw || "").toLowerCase();
  if (s.includes("joint")) return "joint";
  if (s.includes("credit") || s.includes("card")) return "credit";
  if (s.includes("personal")) return "personal";
  if (s.includes("cash")) return "cash";
  return "";
}

function guessCategoryMatch(raw) {
  const s = (raw || "").toLowerCase();
  if (s.includes("grocer")) return "Groceries";
  if (s.includes("dine") || s.includes("takeaway") || s.includes("food") || s.includes("restaurant")) return "Dine Out / Takeaway";
  if (s.includes("home")) return "Home Expenses";
  if (s.includes("personal")) return "Personal Expenses";
  if (s.includes("insur")) return "Insurance";
  if (s.includes("subscri") || s.includes("bill")) return "Subscriptions and Bills";
  if (s.includes("transport") || s.includes("grab") || s.includes("taxi") || s.includes("petrol") || s.includes("mrt")) return "Transportation";
  if (s.includes("repay") || s.includes("loan")) return "Repayments";
  return "Others";
}

function parseFlexibleDate(raw) {
  if (!raw) return "";
  const d = new Date(raw);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  // try DD/MM/YYYY fallback
  const m = String(raw).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    let [_, a, b, y] = m;
    if (y.length === 2) y = "20" + y;
    const d2 = new Date(Number(y), Number(a) - 1, Number(b));
    if (!isNaN(d2.getTime())) return d2.toISOString().slice(0, 10);
  }
  return "";
}

document.getElementById("loadImportBtn").addEventListener("click", async () => {
  const area = document.getElementById("importMappingArea");
  const sourceId = document.getElementById("importSheetIdInput").value.trim();
  const range = document.getElementById("importRangeInput").value.trim() || "A:Z";
  if (!state.accessToken) { area.innerHTML = `<div class="err">Connect your Google account first (above).</div>`; return; }
  if (!sourceId) { area.innerHTML = `<div class="err">Enter the source Spreadsheet ID.</div>`; return; }
  area.innerHTML = `<div class="empty" style="padding:12px;">Loading columns…</div>`;
  try {
    const vals = await fetchSourceValues(sourceId, range);
    const all = vals.values || [];
    if (all.length < 2) { area.innerHTML = `<div class="err">No data rows found in that range.</div>`; return; }
    importData.sourceId = sourceId;
    importData.headers = all[0];
    importData.rows = all.slice(1);
    importData.mapping = { date: "", category: "", amount: "", method: "", remarks: "" };
    importData.methodMap = {};
    renderImportMapping();
  } catch (e) {
    console.error(e);
    area.innerHTML = `<div class="err">Couldn't load that sheet. Check the Spreadsheet ID and range, and that your Google account has access to it.</div>`;
  }
});

async function runImport() {
  const errEl = document.getElementById("importError");
  const okEl = document.getElementById("importOk");
  const btn = document.getElementById("runImportBtn");
  errEl.textContent = ""; okEl.textContent = "";

  const dateIdx = document.getElementById("mapDate").value;
  const catIdx = document.getElementById("mapCategory").value;
  const amtIdx = document.getElementById("mapAmount").value;
  const methodIdx = document.getElementById("mapMethod").value;
  const remarksIdx = document.getElementById("mapRemarks").value;

  if (dateIdx === "" || catIdx === "" || amtIdx === "") {
    errEl.textContent = "Date, Category, and Amount columns are required.";
    return;
  }

  const methodSelects = document.querySelectorAll(".methodMapSelect");
  const methodMap = {};
  methodSelects.forEach(sel => { methodMap[sel.dataset.raw] = sel.value; });

  const categorySelects = document.querySelectorAll(".categoryMapSelect");
  const categoryMap = {};
  categorySelects.forEach(sel => { categoryMap[sel.dataset.raw] = sel.value; });

  btn.disabled = true;
  btn.textContent = "Importing…";

  let skipped = 0;
  const rowsOut = [];
  importData.rows.forEach((r, i) => {
    const rawDate = r[dateIdx];
    const rawCat = (r[catIdx] || "").trim();
    const finalCat = categoryMap[rawCat] || rawCat;
    const rawAmt = (r[amtIdx] || "").toString().replace(/[^0-9.\-]/g, "");
    const amt = parseFloat(rawAmt);
    const date = parseFlexibleDate(rawDate);
    if (!date || !finalCat || !amt || amt <= 0) { skipped++; return; }
    const rawMethod = methodIdx !== "" ? (r[methodIdx] || "").trim() : "";
    const methodId = methodMap[rawMethod] || "cash";
    const remarks = remarksIdx !== "" ? (r[remarksIdx] || "").trim() : "";
    rowsOut.push([date, finalCat, remarks, methodInfo(methodId).label, amt.toFixed(2), "import-" + Date.now() + "-" + i]);
  });

  if (rowsOut.length === 0) {
    errEl.textContent = "Nothing valid to import — check your column mapping.";
    btn.disabled = false;
    btn.textContent = "Import " + importData.rows.length + " rows";
    return;
  }

  try {
    await appendRows(rowsOut);
    okEl.textContent = `Imported ${rowsOut.length} rows` + (skipped ? ` (skipped ${skipped} with missing/invalid data)` : "") + ". Reloading…";
    await loadEntries();
    okEl.textContent = `Done — ${rowsOut.length} entries imported and synced.`;
  } catch (e) {
    console.error(e);
    errEl.textContent = "Import failed partway through. Check your connection and try again — already-imported rows are safe, re-running may create duplicates for those.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Import " + importData.rows.length + " rows";
  }
}

/* ---------- Actions ---------- */
async function handleAdd() {
  const amountInput = document.getElementById("amountInput");
  const dateInput = document.getElementById("dateInput");
  const noteInput = document.getElementById("noteInput");
  const errEl = document.getElementById("addError");
  const okEl = document.getElementById("addOk");
  errEl.textContent = ""; okEl.textContent = "";

  const amt = parseFloat(amountInput.value);
  if (!amt || amt <= 0) { errEl.textContent = "Enter an amount greater than zero."; return; }
  if (!state.category) { errEl.textContent = "Pick what this was for."; return; }
  if (!state.accessToken) { errEl.textContent = "Connect your Google account first (top of page)."; return; }

  const entry = {
    date: dateInput.value || todayStr(),
    category: state.category,
    note: noteInput.value.trim(),
    method: state.method,
    amount: amt,
    rowId: Date.now() + "-" + Math.random().toString(36).slice(2,7),
  };

  const btn = document.getElementById("addBtn");
  btn.disabled = true;
  try {
    await appendEntry(entry);
    okEl.textContent = "Added ✓ synced to your sheet";
    amountInput.value = "";
    noteInput.value = "";
    state.category = "";
    await loadEntries();
  } catch (e) {
    console.error(e);
    errEl.textContent = "Couldn't save to Google Sheets: " + (e && e.message ? e.message : "unknown error") + ". Try Connect again above.";
  } finally {
    btn.disabled = false;
  }
}

async function handleDelete(sheetRow) {
  try {
    await deleteEntryRow(sheetRow);
    await loadEntries();
  } catch (e) {
    console.error(e);
    alert("Couldn't delete that entry. Try again.");
  }
}

function computeStats(entries, mKey) {
  const base = { cash: 0, joint: 0, personal: 0, credit: 0 };
  const catMap = {};
  const list = entries.filter(e => monthKey(e.date) === mKey);
  list.forEach(e => {
    base[e.method] = (base[e.method]||0) + e.amount;
    catMap[e.category] = (catMap[e.category]||0) + e.amount;
  });
  const grand = Object.values(base).reduce((a,b)=>a+b,0);
  return { base, catMap, grand, count: list.length, list };
}

function availableMonths() {
  const set = new Set(state.entries.map(e => monthKey(e.date)));
  set.add(monthKey(todayStr()));
  return Array.from(set).sort().reverse();
}

function renderSummary() {

  const months = availableMonths();
  const thisMonth = monthKey(todayStr());
  const stats = computeStats(state.entries, state.selectedMonth);
  const sortedList = [...stats.list].sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const catTotals = Object.keys(stats.catMap).map(id => ({ id, icon: categoryInfo(id).icon, total: stats.catMap[id] })).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  const filter = state.summaryFilter;
  const filteredList = filter
    ? sortedList.filter(e => filter.type === "method" ? e.method === filter.value : e.category === filter.value)
    : sortedList;
  const filterLabel = filter ? (filter.type === "method" ? methodInfo(filter.value).label : filter.value) : "";

  el.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
      <select class="pill ledger-font" id="monthSelect">
        ${months.map(m => `<option value="${m}" ${m===state.selectedMonth?'selected':''}>${monthLabelOf(m)}${m===thisMonth?' (current)':''}</option>`).join("")}
      </select>
    </div>

    <div class="totals-grid">
      ${METHODS.map(m => {
        const active = filter && filter.type === "method" && filter.value === m.id;
        return `
        <div class="tot-card filter-card ${active?'filter-active':''}" data-filter-method="${m.id}" style="cursor:pointer;">
          <div class="tot-head">${icon(m.icon,13)}<span>${m.label}</span></div>
          <div class="tot-val mono">${fmt(stats.base[m.id])}</div>
        </div>`;
      }).join("")}
    </div>

    <div class="grand">
      <div>
        <div class="mono" style="font-size:10px; letter-spacing:0.1em; color:var(--text-secondary); text-transform:uppercase;">
          ${state.selectedMonth === thisMonth ? "Month-to-date total" : "Month total"}
        </div>
        <div class="ledger-font" style="font-size:15px; color:var(--accent); margin-top:2px;">${stats.count} ${stats.count===1?'entry':'entries'}</div>
      </div>
      <div class="mono" style="font-size:28px; font-weight:600; color:var(--text-strong);">${fmt(stats.grand)}</div>
    </div>

    ${catTotals.length > 0 ? `
    <div style="margin-bottom:20px;">
      <div class="section-head">By category <span style="font-weight:400; text-transform:none; letter-spacing:0;">(tap to filter)</span></div>
      <div class="entry-list">
        ${catTotals.map(c => {
          const active = filter && filter.type === "category" && filter.value === c.id;
          return `
          <div class="cat-bar-row filter-card ${active?'filter-active':''}" data-filter-category="${c.id}" style="cursor:pointer;">
            ${icon(c.icon,14)}
            <div style="flex:1;">
              <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-strong);">
                <span>${c.id}</span><span class="mono" style="font-weight:600;">${fmt(c.total)}</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${stats.grand>0 ? (c.total/stats.grand*100) : 0}%"></div></div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>` : ""}

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
      <div class="section-head" style="margin-bottom:0;">${monthLabelOf(state.selectedMonth)}'s entries</div>
      ${filter ? `<button class="link-btn" id="clearFilterBtn" style="display:flex; align-items:center; gap:5px; color:var(--accent);">Filtering: ${filterLabel} ${icon("close",12)}</button>` : ""}
    </div>
    <div class="entry-list">
      ${filteredList.length === 0 ? `<div class="empty">${filter ? `No ${filterLabel} entries for ${monthLabelOf(state.selectedMonth)}.` : `No entries for ${monthLabelOf(state.selectedMonth)}.`}</div>` :
        filteredList.map(e => {
          const cInfo = categoryInfo(e.category);
          const mInfo = methodInfo(e.method);
          const label = e.note ? `${e.category} · ${e.note}` : e.category;
          return `
            <div class="entry-row">
              <div class="entry-icon">${icon(cInfo.icon,14)}</div>
              <div class="entry-main">
                <div class="entry-title">${label}</div>
                <div class="entry-sub mono">${e.date} · ${mInfo.label}</div>
              </div>
              <div class="entry-amt mono">${fmt(e.amount)}</div>
              <button class="del-btn" data-row="${e.sheetRow}">${icon("trash",14)}</button>
            </div>`;
        }).join("")}
    </div>
    <div class="foot-note">Reading and writing directly to your connected Google Sheet — refresh reloads the latest from everyone.</div>
  `;
  document.getElementById("monthSelect").addEventListener("change", (e) => { state.selectedMonth = e.target.value; renderSummary(); });
  el.querySelectorAll("[data-row]").forEach(b => b.addEventListener("click", () => handleDelete(parseInt(b.dataset.row))));
  el.querySelectorAll("[data-filter-method]").forEach(b => b.addEventListener("click", () => {
    const val = b.dataset.filterMethod;
    state.summaryFilter = (filter && filter.type === "method" && filter.value === val) ? null : { type: "method", value: val };
    renderSummary();
  }));
  el.querySelectorAll("[data-filter-category]").forEach(b => b.addEventListener("click", () => {
    const val = b.dataset.filterCategory;
    state.summaryFilter = (filter && filter.type === "category" && filter.value === val) ? null : { type: "category", value: val };
    renderSummary();
  }));
  const clearBtn = document.getElementById("clearFilterBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => { state.summaryFilter = null; renderSummary(); });
}

function renderCompare() {
  const el = document.getElementById("page-compare");
  if (state.loading) { el.innerHTML = `<div class="empty">Loading entries…</div>`; return; }

  const months = availableMonths();
  if (!state.compareA) state.compareA = months[1] || months[0];
  const statsA = computeStats(state.entries, state.compareA);
  const statsB = computeStats(state.entries, state.compareB);
  const allCategories = Array.from(new Set([...Object.keys(statsA.catMap), ...Object.keys(statsB.catMap)]))
    .map(id => ({ id, label: id }))
    .sort((x, y) => ((statsA.catMap[y.id]||0)+(statsB.catMap[y.id]||0)) - ((statsA.catMap[x.id]||0)+(statsB.catMap[x.id]||0)));
  const maxVal = Math.max(1, ...METHODS.map(m => Math.max(statsA.base[m.id]||0, statsB.base[m.id]||0)), ...allCategories.map(c => Math.max(statsA.catMap[c.id]||0, statsB.catMap[c.id]||0)));

  function deltaBadge(a,b) {
    const diff = b - a;
    const flat = Math.abs(diff) < 0.005;
    const up = diff > 0;
    const pct = a>0 ? (diff/a*100) : (diff>0?100:0);
    const color = flat ? "var(--text-faint)" : up ? "var(--negative)" : "var(--positive)";
    return `<span class="mono" style="color:${color}; font-weight:600; font-size:13px;">${flat?'—':(up?'+':'')+pct.toFixed(0)+'%'}</span>`;
  }

  function barRows(items, statsAObj, statsBObj, keyFn) {
    return items.map(it => {
      const a = keyFn(statsAObj, it.id) || 0;
      const b = keyFn(statsBObj, it.id) || 0;
      if (a === 0 && b === 0) return "";
      return `
        <div class="chart-row">
          <div class="chart-label">${it.label || it.id}</div>
          <div class="chart-bars">
            <div style="display:flex; align-items:center;">
              <div class="chart-bar-track" style="flex:1;"><div class="chart-bar-fill" style="width:${(a/maxVal*100)}%; background:var(--accent-2);"></div></div>
              <span class="chart-val mono">${fmt(a)}</span>
            </div>
            <div style="display:flex; align-items:center;">
              <div class="chart-bar-track" style="flex:1;"><div class="chart-bar-fill" style="width:${(b/maxVal*100)}%; background:var(--accent);"></div></div>
              <span class="chart-val mono">${fmt(b)}</span>
            </div>
          </div>
        </div>`;
    }).join("");
  }

  const methodRows = barRows(METHODS, statsA.base, statsB.base, (obj, id) => obj[id]);
  const catRows = barRows(allCategories, statsA.catMap, statsB.catMap, (obj, id) => obj[id]);

  el.innerHTML = `
    <div class="compare-header">
      <select class="pill ledger-font" id="compareASelect" style="flex:1;">
        ${months.map(m => `<option value="${m}" ${m===state.compareA?'selected':''}>${monthLabelOf(m)}</option>`).join("")}
      </select>
      ${icon("swap",16)}
      <select class="pill ledger-font" id="compareBSelect" style="flex:1;">
        ${months.map(m => `<option value="${m}" ${m===state.compareB?'selected':''}>${monthLabelOf(m)}</option>`).join("")}
      </select>
    </div>

    <div class="grand">
      <div>
        <div class="mono" style="font-size:10px; letter-spacing:0.1em; color:var(--text-secondary); text-transform:uppercase;">${monthLabelOf(state.compareA)}</div>
        <div class="mono" style="font-size:20px; font-weight:600; color:var(--text-strong); margin-top:4px;">${fmt(statsA.grand)}</div>
      </div>
      ${deltaBadge(statsA.grand, statsB.grand)}
      <div style="text-align:right;">
        <div class="mono" style="font-size:10px; letter-spacing:0.1em; color:var(--text-secondary); text-transform:uppercase;">${monthLabelOf(state.compareB)}</div>
        <div class="mono" style="font-size:20px; font-weight:600; color:var(--text-strong); margin-top:4px;">${fmt(statsB.grand)}</div>
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <div class="section-head">By payment method</div>
      <div class="compare-chart">
        <div class="legend"><div class="legend-dot"><span style="background:var(--accent-2);"></span>${monthLabelOf(state.compareA)}</div><div class="legend-dot"><span style="background:var(--accent);"></span>${monthLabelOf(state.compareB)}</div></div>
        ${methodRows || `<div class="empty">No entries in either month.</div>`}
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <div class="section-head">By category</div>
      <div class="compare-chart">
        <div class="legend"><div class="legend-dot"><span style="background:var(--accent-2);"></span>${monthLabelOf(state.compareA)}</div><div class="legend-dot"><span style="background:var(--accent);"></span>${monthLabelOf(state.compareB)}</div></div>
        ${catRows || `<div class="empty">No entries in either month.</div>`}
      </div>
    </div>
    <div class="foot-note">Blue bars are ${monthLabelOf(state.compareA)}, gold bars are ${monthLabelOf(state.compareB)}.</div>
  `;
  document.getElementById("compareASelect").addEventListener("change", (e) => { state.compareA = e.target.value; renderCompare(); });
  document.getElementById("compareBSelect").addEventListener("change", (e) => { state.compareB = e.target.value; renderCompare(); });
}

/* ---------- Init ---------- */
document.querySelectorAll(".tab-btn").forEach(b => {
  b.addEventListener("click", () => { state.page = b.dataset.page; render(); });
});

function applyTheme(themeName) {
  document.documentElement.setAttribute("data-theme", themeName);
  localStorage.setItem("el_theme", themeName);
  document.querySelectorAll(".theme-swatch").forEach(b => b.classList.toggle("active", b.dataset.theme === themeName));
}

document.querySelectorAll(".theme-swatch").forEach(b => {
  b.addEventListener("click", () => applyTheme(b.dataset.theme));
});

window.addEventListener("DOMContentLoaded", () => {
  applyTheme(localStorage.getItem("el_theme") || "terracotta");
  const { clientId, sheetId } = getSettings();
  document.getElementById("clientIdInput").value = clientId;
  document.getElementById("sheetIdInput").value = sheetId;
  document.getElementById("tabNameInput").value = tabName();
  if (clientId && sheetId) setStatus("Connecting…");
  state.loading = false;
  render();
  // Wait for GIS script to load before initializing token client
  const waitForGis = setInterval(() => {
    if (window.google && google.accounts) {
      clearInterval(waitForGis);
      initAuth();
    }
  }, 200);
});
</script>
</body>
</html>
